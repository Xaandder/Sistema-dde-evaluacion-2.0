# =============================================================
# Sistema de Gestion de Calificaciones Academicas - Backend
# Configuracion general (perfil por defecto, desarrollo)
# =============================================================

spring:
  application:
    name: sistema-evaluacion

  # -------------------------------------------------------------------
  # La autenticacion es 100% JWT (JwtAuthenticationFilter + UsuarioRepositorio):
  # no existe ni se usa un UserDetailsService. Se excluye la
  # autoconfiguracion de Spring Boot que crea un InMemoryUserDetailsManager
  # solo para generar una contrasena aleatoria de consola (advertencia
  # "generated security password"); nada del proyecto depende de ella.
  # -------------------------------------------------------------------
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # -------------------------------------------------------------------
  # Base de datos Oracle 26ai Free (Etapa 2)
  # Los valores REALES se toman de variables de entorno (DB_URL,
  # DB_USER, DB_PASSWORD) o del archivo application-local.yml (perfil
  # "local", excluido de Git). Nunca escribir credenciales aqui.
  # -------------------------------------------------------------------
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    # defaultRowPrefetch: tamaño de lectura POR DEFECTO del driver Oracle
    # (10). Con 100 el driver trae 100 filas por viaje de red (el reporte de
    # Hibernate lee este valor de los metadatos del driver). Hikari lo pasa
    # como propiedad de conexion; no agrega dependencias.
    hikari:
      data-source-properties:
        defaultRowPrefetch: 100

  # JPA en modo "validate": Hibernate solo VERIFICA contra la base;
  # NUNCA crea ni modifica tablas (Etapa 2-final, regla del proyecto).
  # fetch_size=100: lecturas por lotes (evita la advertencia "Low default
  # JDBC fetch size: 10" y reduce los viajes a red en los listados paginados).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          fetch_size: 100

  # No mostrar campos nulos en las respuestas JSON
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

# Actuator: solo health e info expuestos
# show-components: permite ver los componentes de salud (ej. "db")
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always

# Swagger UI (habilitado en desarrollo; se restringira en perfiles no desarrolladores)
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# -------------------------------------------------------------------
# Seguridad (Etapa 3): JWT
# El secreto NUNCA se escribe en el repositorio: se toma de la variable
# de entorno JWT_SECRET (minimo 32 caracteres, sin valores por defecto).
# TTL configurable (480 min = 8 horas, decision aprobada).
# -------------------------------------------------------------------
app:
  jwt:
    secreto: ${JWT_SECRET:}
    ttl-minutos: ${JWT_TTL_MINUTOS:480}
